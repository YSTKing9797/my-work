<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>宇宙雑学</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body class="text-normal">


    <!-- =========================================
         🌌 動く宇宙背景
    ========================================== -->

    <div id="space-background">

        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="nebula nebula-3"></div>

        <div id="stars"></div>

        <div id="shooting-stars"></div>

        <div class="space-glow glow-1"></div>
        <div class="space-glow glow-2"></div>

    </div>


    <!-- =========================================
         👑 ヘッダー
    ========================================== -->

    <header class="main-header">

        <button
            class="menu-trigger-btn"
            onclick="playSound('click'); toggleSidebar();"
        >
            ☰
        </button>


        <div class="header-title-area">

            <h1>宇宙雑学</h1>

            <p class="subtitle">
                💡 新しいことを知る面白さを届ける
            </p>

        </div>

    </header>


    <!-- =========================================
         🌿 サイドメニュー
    ========================================== -->

    <div
        id="sidebar-menu"
        class="sidebar"
    >

        <div class="sidebar-header">

            <h3>
                ⚙️ サイト設定
            </h3>

            <button
                class="close-sidebar-btn"
                onclick="playSound('click'); toggleSidebar();"
            >
                ×
            </button>

        </div>


        <div class="sidebar-content">

            <p class="menu-section-title">
                文字の大きさ
            </p>


            <div class="setting-row">

                <button
                    class="setting-btn"
                    onclick="playSound('click'); changeTextSize('small');"
                >
                    小
                </button>

                <button
                    class="setting-btn active"
                    onclick="playSound('click'); changeTextSize('normal');"
                >
                    標準
                </button>

                <button
                    class="setting-btn"
                    onclick="playSound('click'); changeTextSize('large');"
                >
                    大
                </button>

            </div>


            <p class="menu-section-title">
                効果音の設定
            </p>


            <div class="setting-row">

                <button
                    id="sound-on-btn"
                    class="setting-btn active"
                    onclick="setSound(true)"
                >
                    ON
                </button>

                <button
                    id="sound-off-btn"
                    class="setting-btn"
                    onclick="setSound(false)"
                >
                    OFF
                </button>

            </div>


            <p class="menu-section-title">
                記事の並び替え
            </p>


            <button
                class="sidebar-menu-item"
                onclick="playSound('click'); sortArticles('new');"
            >
                🕒 新しい順に並べる
            </button>


            <button
                class="sidebar-menu-item"
                onclick="playSound('click'); sortArticles('old');"
            >
                ⏳ 古い順に並べる
            </button>

        </div>

    </div>


    <!-- =========================================
         サイドメニュー背景
    ========================================== -->

    <div
        id="sidebar-overlay"
        class="overlay-shadow"
        onclick="toggleSidebar()"
    ></div>


    <!-- =========================================
         メインコンテナ
    ========================================== -->

    <div class="container">


        <!-- =====================================
             一覧ページ
        ====================================== -->

        <div id="main-page"></div>


        <!-- =====================================
             詳細ページ
        ====================================== -->

        <div
            id="detail-page"
            class="detail-page-content"
            style="display: none;"
        >

            <!-- 話数表示 -->

            <div
                id="detail-episode"
                class="detail-episode"
            >
                第1話
            </div>


            <!-- 記事タイトル -->

            <h2
                id="detail-title"
                class="detail-title"
            >
                記事タイトル
            </h2>


            <!-- 記事本文 -->

            <div
                id="detail-text"
                class="detail-text"
            >
                記事の本文
            </div>


            <!-- =================================
                 クイズ
            ================================== -->

            <div id="quiz-area">

                <div id="quiz-start-view">

                    <button
                        class="more-btn"
                        onclick="playSound('click'); startQuizGame();"
                    >
                        💡 この記事のクイズに挑戦する！
                    </button>

                </div>


                <div
                    id="quiz-game-view"
                    style="display: none;"
                >

                    <div
                        id="quiz-progress"
                        class="quiz-progress"
                    >
                        第1問 / 全5問
                    </div>


                    <h3 id="quiz-question">
                        問題文
                    </h3>


                    <div
                        id="quiz-feedback"
                        class="quiz-feedback"
                    ></div>


                    <div
                        class="quiz-options"
                        id="quiz-options-container"
                    ></div>

                </div>


                <!-- =================================
                     クイズ結果
                ================================== -->

                <div
                    id="quiz-result-view"
                    style="display: none;"
                >

                    <div
                        id="quiz-result-icon"
                        class="quiz-result-icon"
                    >
                        🎉
                    </div>


                    <h3
                        id="quiz-result-title"
                        class="quiz-result-title"
                    >
                        クイズ終了！
                    </h3>


                    <p
                        id="quiz-result-score"
                        class="quiz-result-score"
                    >
                        5 / 5
                    </p>


                    <button
                        class="more-btn"
                        onclick="playSound('click'); restartQuizGame();"
                    >
                        🔄 もう一度挑戦する
                    </button>

                </div>

            </div>


            <!-- =================================
                 注意書き
            ================================== -->

            <p class="disclaimer">
                このウェブサイトでは、様々な資料や情報を元に記事を作成しています。ただし、情報の誤りや、筆者の推測・解釈が含まれている可能性があります。重要な情報については、このウェブサイトの内容だけを判断材料にせず、信頼できる情報源で必ずご確認ください。
            </p>


            <!-- =================================
                 一覧に戻る
            ================================== -->

            <div class="back-btn-wrapper">

                <button
                    class="back-btn"
                    onclick="playSound('click'); goToMainPage();"
                >
                    一覧に戻る
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         🎉 お祝い演出
    ========================================== -->

    <div
        id="celebration-overlay"
        onclick="closeCelebration()"
    >

        <div
            class="celebration-title"
            id="celebration-text"
        >
            🎉 全問正解！おめでとう！ 🎉
        </div>


        <p class="celebration-help">
            画面をクリックして閉じる
        </p>

    </div>


    <!-- =========================================
         JavaScript
    ========================================== -->

    <script src="script.js"></script>

</body>

</html>
